<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 15px; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
</style>
</head>
<body>
  <div id="dfd2">
    <svg width="860" height="320" viewBox="0 0 860 320">
      <defs>
        <marker id="ar3" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937" />
        </marker>
      </defs>
      <!-- Sub-process 4.1 -->
      <circle cx="120" cy="80" r="50" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
      <text x="120" y="75" font-size="11" font-weight="bold" fill="#14532d" text-anchor="middle">4.1</text>
      <text x="120" y="90" font-size="10" font-weight="bold" fill="#14532d" text-anchor="middle">Source Pairing</text>

      <!-- Sub-process 4.2 -->
      <circle cx="340" cy="80" r="50" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
      <text x="340" y="75" font-size="11" font-weight="bold" fill="#14532d" text-anchor="middle">4.2</text>
      <text x="340" y="90" font-size="10" font-weight="bold" fill="#14532d" text-anchor="middle">Entailment Check</text>

      <!-- Sub-process 4.3 -->
      <circle cx="560" cy="80" r="50" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
      <text x="560" y="75" font-size="11" font-weight="bold" fill="#14532d" text-anchor="middle">4.3</text>
      <text x="560" y="90" font-size="10" font-weight="bold" fill="#14532d" text-anchor="middle">Contradiction Radar</text>

      <!-- Sub-process 4.4 -->
      <circle cx="760" cy="80" r="50" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
      <text x="760" y="75" font-size="11" font-weight="bold" fill="#14532d" text-anchor="middle">4.4</text>
      <text x="760" y="90" font-size="10" font-weight="bold" fill="#14532d" text-anchor="middle">Confidence Scoring</text>

      <!-- DB Store -->
      <rect x="420" y="220" width="180" height="50" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/>
      <text x="510" y="250" font-size="11" font-weight="bold" fill="#713f12" text-anchor="middle">D2: Claim & Citation Store</text>

      <!-- Flows -->
      <line x1="170" y1="80" x2="285" y2="80" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ar3)"/>
      <text x="228" y="72" font-size="9" fill="#1f2937" text-anchor="middle">claim + quote</text>

      <line x1="390" y1="80" x2="505" y2="80" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ar3)"/>
      <text x="448" y="72" font-size="9" fill="#1f2937" text-anchor="middle">verdict</text>

      <line x1="610" y1="80" x2="705" y2="80" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ar3)"/>
      <text x="658" y="72" font-size="9" fill="#1f2937" text-anchor="middle">disputes</text>

      <path d="M 760 130 L 760 180 L 580 220" stroke="#1f2937" stroke-width="1.5" fill="none" marker-end="url(#ar3)"/>
      <text x="700" y="170" font-size="9" fill="#1f2937">verifications</text>
    </svg>
  </div>
</body>
</html>
