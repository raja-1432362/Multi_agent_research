<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    padding: 20px;
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #111827;
  }
  .diagram-container {
    width: 900px;
    margin-bottom: 50px;
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 24px;
    box-sizing: border-box;
  }
  h2 {
    margin-top: 0;
    font-size: 18px;
    color: #1f2937;
    border-bottom: 2px solid #e5e7eb;
    padding-bottom: 8px;
    margin-bottom: 16px;
  }
  svg text {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
</style>
</head>
<body>

<!-- ERD Diagram -->
<div id="erd" class="diagram-container">
  <h2>ENTITY RELATIONSHIP DIAGRAM (ERD) — EVIDENCE DESK</h2>
  <svg width="850" height="420" viewBox="0 0 850 420">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563" />
      </marker>
    </defs>
    <!-- USER Entity -->
    <rect x="30" y="40" width="160" height="90" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="110" y="65" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">USER</text>
    <text x="45" y="85" font-size="11" fill="#374151">• user_id (PK)</text>
    <text x="45" y="100" font-size="11" fill="#374151">• email, passwordHash</text>
    <text x="45" y="115" font-size="11" fill="#374151">• created_at</text>

    <!-- RESEARCH Entity -->
    <rect x="340" y="40" width="180" height="110" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="430" y="65" font-size="14" font-weight="bold" fill="#4c1d95" text-anchor="middle">RESEARCH</text>
    <text x="355" y="85" font-size="11" fill="#374151">• research_id (PK)</text>
    <text x="355" y="100" font-size="11" fill="#374151">• user_id (FK)</text>
    <text x="355" y="115" font-size="11" fill="#374151">• query, topic, summary</text>
    <text x="355" y="130" font-size="11" fill="#374151">• factual_score, status</text>

    <!-- SOURCE Entity -->
    <rect x="650" y="40" width="170" height="110" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="735" y="65" font-size="14" font-weight="bold" fill="#064e3b" text-anchor="middle">SOURCE</text>
    <text x="665" y="85" font-size="11" fill="#374151">• source_id (PK)</text>
    <text x="665" y="100" font-size="11" fill="#374151">• research_id (FK)</text>
    <text x="665" y="115" font-size="11" fill="#374151">• url, title, snippet</text>
    <text x="665" y="130" font-size="11" fill="#374151">• reliability_score</text>

    <!-- CLAIM Entity -->
    <rect x="230" y="270" width="180" height="110" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="320" y="295" font-size="14" font-weight="bold" fill="#7c2d12" text-anchor="middle">CLAIM</text>
    <text x="245" y="315" font-size="11" fill="#374151">• claim_id (PK)</text>
    <text x="245" y="330" font-size="11" fill="#374151">• research_id (FK)</text>
    <text x="245" y="345" font-size="11" fill="#374151">• claim_text, status</text>
    <text x="245" y="360" font-size="11" fill="#374151">• confidence_score</text>

    <!-- CITATION Entity -->
    <rect x="540" y="270" width="180" height="100" rx="6" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text x="630" y="295" font-size="14" font-weight="bold" fill="#831843" text-anchor="middle">CITATION</text>
    <text x="555" y="315" font-size="11" fill="#374151">• citation_id (PK)</text>
    <text x="555" y="330" font-size="11" fill="#374151">• claim_id (FK)</text>
    <text x="555" y="345" font-size="11" fill="#374151">• source_id (FK)</text>
    <text x="555" y="360" font-size="11" fill="#374151">• support_type (supports/refutes)</text>

    <!-- Relationships -->
    <!-- USER to RESEARCH: 1 to M -->
    <line x1="190" y1="85" x2="340" y2="85" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
    <polygon points="265,70 295,85 265,100 235,85" fill="#fef08a" stroke="#ca8a04" stroke-width="1.2"/>
    <text x="265" y="89" font-size="10" font-weight="bold" fill="#854d0e" text-anchor="middle">initiates</text>
    <text x="198" y="78" font-size="11" fill="#4b5563">1</text>
    <text x="328" y="78" font-size="11" fill="#4b5563">N</text>

    <!-- RESEARCH to SOURCE: 1 to M -->
    <line x1="520" y1="85" x2="650" y2="85" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
    <polygon points="585,70 615,85 585,100 555,85" fill="#fef08a" stroke="#ca8a04" stroke-width="1.2"/>
    <text x="585" y="89" font-size="10" font-weight="bold" fill="#854d0e" text-anchor="middle">aggregates</text>
    <text x="528" y="78" font-size="11" fill="#4b5563">1</text>
    <text x="638" y="78" font-size="11" fill="#4b5563">N</text>

    <!-- RESEARCH to CLAIM: 1 to M -->
    <line x1="400" y1="150" x2="330" y2="270" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
    <polygon points="365,195 385,210 365,225 345,210" fill="#fef08a" stroke="#ca8a04" stroke-width="1.2"/>
    <text x="365" y="214" font-size="10" font-weight="bold" fill="#854d0e" text-anchor="middle">extracts</text>
    <text x="390" y="170" font-size="11" fill="#4b5563">1</text>
    <text x="345" y="255" font-size="11" fill="#4b5563">N</text>

    <!-- CLAIM to CITATION: 1 to M -->
    <line x1="410" y1="320" x2="540" y2="320" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
    <polygon points="475,305 505,320 475,335 445,320" fill="#fef08a" stroke="#ca8a04" stroke-width="1.2"/>
    <text x="475" y="324" font-size="10" font-weight="bold" fill="#854d0e" text-anchor="middle">verifies</text>
    <text x="418" y="312" font-size="11" fill="#4b5563">1</text>
    <text x="528" y="312" font-size="11" fill="#4b5563">N</text>

    <!-- SOURCE to CITATION: 1 to M -->
    <path d="M 720 150 L 720 230 L 670 270" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <text x="730" y="195" font-size="10" fill="#4b5563">proves 1:N</text>
  </svg>
</div>

<!-- DFD Level 0 -->
<div id="dfd0" class="diagram-container">
  <h2>DATA FLOW DIAGRAM (DFD LEVEL 0) — CONTEXT LEVEL</h2>
  <svg width="850" height="280" viewBox="0 0 850 280">
    <defs>
      <marker id="arrow2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151" />
      </marker>
    </defs>
    <!-- User Entity -->
    <rect x="40" y="90" width="140" height="70" rx="4" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
    <text x="110" y="130" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">USER / RESEARCHER</text>

    <!-- Central Process -->
    <circle cx="420" cy="125" r="75" fill="#e0e7ff" stroke="#4338ca" stroke-width="2.5"/>
    <text x="420" y="115" font-size="13" font-weight="bold" fill="#1e1b4b" text-anchor="middle">0.0</text>
    <text x="420" y="132" font-size="13" font-weight="bold" fill="#1e1b4b" text-anchor="middle">EVIDENCE DESK</text>
    <text x="420" y="148" font-size="11" fill="#4338ca" text-anchor="middle">Research System</text>

    <!-- External Services -->
    <rect x="660" y="40" width="150" height="60" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="735" y="65" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">TAVILY WEB SEARCH</text>
    <text x="735" y="82" font-size="10" fill="#6b7280" text-anchor="middle">(Live Web Scraper)</text>

    <rect x="660" y="150" width="150" height="60" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="735" y="175" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">GOOGLE GEMINI API</text>
    <text x="735" y="192" font-size="10" fill="#6b7280" text-anchor="middle">(Multi-Agent LLM)</text>

    <!-- Flows: User to System -->
    <line x1="180" y1="110" x2="340" y2="110" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <text x="260" y="103" font-size="10" font-weight="bold" fill="#1f2937" text-anchor="middle">Research Query & Scope</text>

    <line x1="345" y1="140" x2="180" y2="140" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <text x="260" y="155" font-size="10" font-weight="bold" fill="#1f2937" text-anchor="middle">Verified Report & Graph</text>

    <!-- Flows: System to External -->
    <line x1="490" y1="100" x2="660" y2="70" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <text x="575" y="75" font-size="9" fill="#1f2937" text-anchor="middle">Search Queries</text>

    <line x1="660" y1="85" x2="495" y2="110" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <text x="575" y="105" font-size="9" fill="#1f2937" text-anchor="middle">Live Web Raw Content</text>

    <line x1="495" y1="145" x2="660" y2="165" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <text x="575" y="148" font-size="9" fill="#1f2937" text-anchor="middle">Prompts & Grounding Context</text>

    <line x1="660" y1="185" x2="490" y2="155" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <text x="575" y="180" font-size="9" fill="#1f2937" text-anchor="middle">Structured Claims & Verdicts</text>
  </svg>
</div>

<!-- DFD Level 1 -->
<div id="dfd1" class="diagram-container">
  <h2>DATA FLOW DIAGRAM (DFD LEVEL 1) — SYSTEM DECOMPOSITION</h2>
  <svg width="850" height="340" viewBox="0 0 850 340">
    <defs>
      <marker id="arrow3" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151" />
      </marker>
    </defs>
    <!-- Process 1.0 -->
    <circle cx="90" cy="80" r="50" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
    <text x="90" y="75" font-size="11" font-weight="bold" fill="#4c1d95" text-anchor="middle">1.0</text>
    <text x="90" y="90" font-size="10" font-weight="bold" fill="#4c1d95" text-anchor="middle">Query Plan</text>

    <!-- Process 2.0 -->
    <circle cx="270" cy="80" r="50" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
    <text x="270" y="75" font-size="11" font-weight="bold" fill="#4c1d95" text-anchor="middle">2.0</text>
    <text x="270" y="90" font-size="10" font-weight="bold" fill="#4c1d95" text-anchor="middle">Web Search</text>

    <!-- Process 3.0 -->
    <circle cx="450" cy="80" r="50" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
    <text x="450" y="75" font-size="11" font-weight="bold" fill="#4c1d95" text-anchor="middle">3.0</text>
    <text x="450" y="90" font-size="10" font-weight="bold" fill="#4c1d95" text-anchor="middle">Scraping</text>

    <!-- Process 4.0 -->
    <circle cx="630" cy="80" r="50" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
    <text x="630" y="75" font-size="11" font-weight="bold" fill="#4c1d95" text-anchor="middle">4.0</text>
    <text x="630" y="90" font-size="10" font-weight="bold" fill="#4c1d95" text-anchor="middle">Claim Extract</text>

    <!-- Process 5.0 -->
    <circle cx="450" cy="240" r="50" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
    <text x="450" y="235" font-size="11" font-weight="bold" fill="#4c1d95" text-anchor="middle">5.0</text>
    <text x="450" y="250" font-size="10" font-weight="bold" fill="#4c1d95" text-anchor="middle">Dual-Judge Verifier</text>

    <!-- Process 6.0 -->
    <circle cx="210" cy="240" r="50" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
    <text x="210" y="235" font-size="11" font-weight="bold" fill="#4c1d95" text-anchor="middle">6.0</text>
    <text x="210" y="250" font-size="10" font-weight="bold" fill="#4c1d95" text-anchor="middle">Synthesis & Graph</text>

    <!-- Data Stores -->
    <rect x="670" y="215" width="130" height="45" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/>
    <text x="735" y="242" font-size="11" font-weight="bold" fill="#713f12" text-anchor="middle">D1: MongoDB</text>

    <!-- Arrows -->
    <line x1="140" y1="80" x2="215" y2="80" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow3)"/>
    <line x1="320" y1="80" x2="395" y2="80" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow3)"/>
    <line x1="500" y1="80" x2="575" y2="80" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow3)"/>
    <path d="M 630 130 L 630 180 L 500 230" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#arrow3)"/>
    <line x1="395" y1="240" x2="265" y2="240" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow3)"/>
    <line x1="505" y1="240" x2="665" y2="240" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow3)"/>
    <text x="585" y="232" font-size="9" fill="#374151">Save Claims</text>
  </svg>
</div>

</body>
</html>
