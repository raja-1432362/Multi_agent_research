<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 15px; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
</style>
</head>
<body>
  <!-- DFD 0 -->
  <div id="dfd0">
    <svg width="860" height="260" viewBox="0 0 860 260">
      <defs>
        <marker id="ar1" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937" />
        </marker>
      </defs>
      <!-- External User -->
      <rect x="40" y="80" width="150" height="80" rx="4" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
      <text x="115" y="115" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">RESEARCHER</text>
      <text x="115" y="135" font-size="12" fill="#4b5563" text-anchor="middle">(User / Client)</text>

      <!-- Central Process 0.0 -->
      <circle cx="430" cy="120" r="75" fill="#e0e7ff" stroke="#3730a3" stroke-width="2.5"/>
      <text x="430" y="105" font-size="14" font-weight="bold" fill="#312e81" text-anchor="middle">0.0</text>
      <text x="430" y="125" font-size="14" font-weight="bold" fill="#312e81" text-anchor="middle">EVIDENCE DESK</text>
      <text x="430" y="145" font-size="12" fill="#4338ca" text-anchor="middle">Multi-Agent System</text>

      <!-- External Web Engine -->
      <rect x="670" y="30" width="160" height="70" rx="4" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
      <text x="750" y="58" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">TAVILY API</text>
      <text x="750" y="78" font-size="11" fill="#7f1d1d" text-anchor="middle">(Web Engine)</text>

      <!-- External LLM -->
      <rect x="670" y="140" width="160" height="70" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
      <text x="750" y="168" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">GEMINI 2.5 API</text>
      <text x="750" y="188" font-size="11" fill="#14532d" text-anchor="middle">(LLM Reasoning)</text>

      <!-- Connectors -->
      <line x1="190" y1="105" x2="350" y2="105" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ar1)"/>
      <text x="270" y="98" font-size="10" font-weight="bold" fill="#111827" text-anchor="middle">1. Query & Target Hypothesis</text>

      <line x1="355" y1="135" x2="190" y2="135" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ar1)"/>
      <text x="270" y="152" font-size="10" font-weight="bold" fill="#111827" text-anchor="middle">2. Grounded Report & Radar</text>

      <line x1="505" y1="95" x2="670" y2="65" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ar1)"/>
      <text x="590" y="72" font-size="10" font-weight="bold" fill="#111827" text-anchor="middle">Sub-Queries</text>

      <line x1="670" y1="80" x2="505" y2="110" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ar1)"/>
      <text x="590" y="104" font-size="10" font-weight="bold" fill="#111827" text-anchor="middle">Scraped Raw Text</text>

      <line x1="505" y1="135" x2="670" y2="160" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ar1)"/>
      <text x="590" y="142" font-size="10" font-weight="bold" fill="#111827" text-anchor="middle">Claim Prompts</text>

      <line x1="670" y1="180" x2="505" y2="150" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ar1)"/>
      <text x="590" y="174" font-size="10" font-weight="bold" fill="#111827" text-anchor="middle">Verdicts & Badges</text>
    </svg>
  </div>
</body>
</html>
